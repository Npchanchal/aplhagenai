services:
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: intellens
      POSTGRES_PASSWORD: intellens
      POSTGRES_DB: intellens
    ports:
      - "5432:5432"
    volumes:
      - intellens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellens -d intellens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      INTELLENS_CRAWL_LIVE: "1"
      INTELLENS_REFRESH_HOURS: "6"
      INTELLENS_AUTO_EXTRACT_ON_REFRESH: "1"
      INTELLENS_GCI_VERSION: ${INTELLENS_GCI_VERSION:-v4}
      AUTH_RATE_LIMIT_RPM: ${AUTH_RATE_LIMIT_RPM:-20}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-300}
      INTELLENS_AUTH_DEV_TOKENS: ${INTELLENS_AUTH_DEV_TOKENS:-1}
      USE_DB_AUTH: "1"
      AUTH_SQLITE_PATH: /app/app/data/auth.db
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
      INTELLENS_VERIFY_SOURCES: ${INTELLENS_VERIFY_SOURCES:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_GSC_VERIFICATION: ${VITE_GSC_VERIFICATION:-}
        VITE_BING_VERIFICATION: ${VITE_BING_VERIFICATION:-}
        VITE_TWITTER_SITE: ${VITE_TWITTER_SITE:-}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # Live GCI refresh every 6 hours — hits API so store/crawl state stay in the api container
  scheduler:
    build: ./backend
    command:
      [
        "python",
        "-m",
        "app.jobs.gci_refresh",
        "--loop",
        "--live",
        "--limit",
        "30",
        "--via-api",
        "http://api:8000",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      INTELLENS_CRAWL_LIVE: "1"
      INTELLENS_REFRESH_HOURS: "6"
      INTELLENS_AUTO_EXTRACT_ON_REFRESH: "1"
      INTELLENS_WARM_FMP_ON_REFRESH: "1"
      INTELLENS_GCI_VERSION: ${INTELLENS_GCI_VERSION:-v4}
      INTELLENS_API_KEY: ${INTELLENS_API_KEY:-intellens-demo}
      INTELLENS_VERIFY_SOURCES: "1"
      INTELLENS_LEDGER_DIGEST: "1"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  intellens_pg:
