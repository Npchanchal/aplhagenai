server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    image/svg+xml;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://plausible.io; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://plausible.io; frame-src https://www.googletagmanager.com" always;

  if ($uri ~ ^(.+)/$) {
    return 301 https://$host$1$is_args$args;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /ai.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location ~ ^/citealpha-indexnow-key-2026\.txt$ {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap-images.xml {
    try_files $uri =404;
  }

  location = /rss.xml {
    default_type application/rss+xml;
    try_files $uri =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api:8000/health;
  }

  # HTML must revalidate: it names hashed /assets bundles that disappear on the next deploy.
  # `expires` (not add_header) keeps the server-level security headers inherited.
  location = / {
    expires epoch;
    try_files /index.html =404;
  }

  location / {
    expires epoch;
    try_files $uri $uri/index.html /app-shell.html;
  }

  include /etc/nginx/snippets/static-cache.conf;
}
