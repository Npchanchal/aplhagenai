# Included inside each server { } block — cache + 404 for static SPA host.

error_page 404 /404.html;

location = /404.html {
  try_files /404.html =404;
}

# Vite hashed bundles — safe to cache immutably.
location ^~ /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# Fonts, images, and other static files (unhashed public/ paths).
location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
  expires 30d;
  add_header Cache-Control "public";
  try_files $uri =404;
}
