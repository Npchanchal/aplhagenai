server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    image/svg+xml;

  # API is routed by ALB; this container only serves the SPA.
  # Strip trailing slash (keep /). Force https — ALB terminates TLS so $scheme is http.
  if ($uri ~ ^(.+)/$) {
    return 301 https://$host$1$is_args$args;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /robots.txt {
    try_files $uri =404;
  }

  location = /sitemap.xml {
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /ai.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location ~ ^/citealpha-indexnow-key-2026\.txt$ {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap-images.xml {
    try_files $uri =404;
  }

  location = /rss.xml {
    default_type application/rss+xml;
    try_files $uri =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  # Exact apex: always the prerendered homepage (never app-shell).
  location = / {
    try_files /index.html =404;
  }

  # Prerendered route HTML first; app-shell for unknown SPA paths (no homepage SEO leak).
  location / {
    try_files $uri $uri/index.html /app-shell.html;
  }

  include /etc/nginx/snippets/static-cache.conf;
}